name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: go mod verify
        run: go mod verify
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...
      - name: go test -race
        run: go test -race -count=1 ./...
      - name: fuzz (short)
        run: make fuzz FUZZTIME=10s

  shared-backend:
    # The multi-process backend (hosting option B): DynamoDB conformance,
    # Valkey coordination, the whole API suite on DynamoDB, and the
    # two-process e2e (wake, open token, claim, replay, shared rate limit,
    # mailbox deletion).
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    # Service images: VettID's mirror of the upstream digests (vettid.org
    # .github/mirror), not Docker Hub (anonymous pull limits on shared
    # runners). The upstream reference is in the comment.
    services:
      dynamodb:
        # docker.io/amazon/dynamodb-local:3.3.1@sha256:ff89bd48ff32cd8d9be5fee8873b65b8854dc408f1afe881be6eb00247bc0dab
        image: ghcr.io/vettid/mirror/dynamodb-local@sha256:ff89bd48ff32cd8d9be5fee8873b65b8854dc408f1afe881be6eb00247bc0dab
        ports: ["18000:8000"]
        options: --memory 1g
      valkey:
        # docker.io/valkey/valkey:8.1.10-alpine@sha256:081c2f5cb575efc901aa80ff9cdbd1ec6a301682fd35e1ebb4b0990a4a4a8507
        image: ghcr.io/vettid/mirror/valkey@sha256:081c2f5cb575efc901aa80ff9cdbd1ec6a301682fd35e1ebb4b0990a4a4a8507
        ports: ["16379:6379"]
        options: --memory 256m
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: wait for DynamoDB Local
        run: for i in $(seq 1 60); do curl -s -o /dev/null http://127.0.0.1:18000 && exit 0; sleep 1; done; exit 1
      - name: tests against DynamoDB Local + Valkey
        run: make test-shared

  gitleaks:
    # Pinned binary over the FULL history (the gitleaks-action fails on a
    # branch's first push, where there is no "before" commit).
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: install gitleaks v8.30.1 (checksum-verified)
        run: |
          curl -sSLo gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gl.tgz" | sha256sum -c -
          tar -xzf gl.tgz gitleaks
      - name: scan full history
        run: ./gitleaks git --redact --verbose .

  image:
    runs-on: ubuntu-26.04
    needs: [test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: mirror settings match the Dockerfile
        # BUILDKIT_SYNTAX must be the mirror of the Dockerfile's pinned
        # # syntax digest, and each build-contexts key must be one of its
        # FROM references (a key that matches no FROM is ignored, and the
        # image would come from Docker Hub after all).
        run: |
          bad=0
          want=$(sed -nE '1s/^# syntax=[^ ]+@(sha256:[0-9a-f]{64})$/\1/p' Dockerfile)
          [ -n "$want" ] || { echo "::error::the Dockerfile's # syntax line is not pinned by digest"; bad=1; }
          syn=$(grep -oE '^ +BUILDKIT_SYNTAX=[^ ]+' .github/workflows/ci.yml | sed -E 's/^ +//' || true)
          [ -n "$syn" ] || { echo "::error::no BUILDKIT_SYNTAX in ci.yml"; bad=1; }
          for v in $syn; do
            [ "${v##*@}" = "$want" ] || { echo "::error::$v, Dockerfile # syntax digest $want"; bad=1; }
          done
          froms=$(sed -nE 's/^FROM (--platform=[^ ]+ )?([^ ]+).*/\2/p' Dockerfile)
          keys=$(grep -oE '^ +[^ =#]+@sha256:[0-9a-f]{64}=docker-image://' .github/workflows/ci.yml | sed -E 's/^ +//; s/=docker-image:\/\/$//' || true)
          [ -n "$keys" ] || { echo "::error::no build-contexts in ci.yml"; bad=1; }
          for k in $keys; do
            grep -qxF -- "$k" <<<"$froms" || { echo "::error::build-contexts key $k is not a FROM of the Dockerfile"; bad=1; }
          done
          exit "$bad"
      # binfmt, BuildKit, the Dockerfile frontend and the golang base image
      # from VettID's mirror of the upstream digests (vettid.org
      # .github/mirror), not Docker Hub; upstream references in the comments.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          # docker.io/tonistiigi/binfmt:latest@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          image: ghcr.io/vettid/mirror/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # docker.io/moby/buildkit:buildx-stable-1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea (v0.33.1)
          driver-opts: image=ghcr.io/vettid/mirror/buildkit@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
      - name: build image (amd64 + arm64, not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          tags: vettid-relay:ci
          # Dockerfile: # syntax=docker.io/docker/dockerfile:1@sha256:4edf897a3ffa55b89f906fc8cc78afdb3f1834cc9c7083565e611a8a7d5fe99e
          build-args: |
            BUILDKIT_SYNTAX=ghcr.io/vettid/mirror/dockerfile@sha256:4edf897a3ffa55b89f906fc8cc78afdb3f1834cc9c7083565e611a8a7d5fe99e
          # Dockerfile: FROM docker.io/library/golang:1.26.10-alpine@sha256:9ce231b28998b32e116927c61aa5c406183061d4f3f2d61b292c88e7f6bdf7ca
          build-contexts: |
            docker.io/library/golang:1.26.10-alpine@sha256:9ce231b28998b32e116927c61aa5c406183061d4f3f2d61b292c88e7f6bdf7ca=docker-image://ghcr.io/vettid/mirror/golang@sha256:9ce231b28998b32e116927c61aa5c406183061d4f3f2d61b292c88e7f6bdf7ca

  publish:
    # main only: publish a multi-arch image to GHCR. Deployments pin the
    # resulting digest (never a tag), so a push here deploys nothing by itself.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    needs: [test, shared-backend, gitleaks]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # binfmt, BuildKit, the Dockerfile frontend and the golang base image
      # from VettID's mirror of the upstream digests (vettid.org
      # .github/mirror), not Docker Hub; upstream references in the comments.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          # docker.io/tonistiigi/binfmt:latest@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          image: ghcr.io/vettid/mirror/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # docker.io/moby/buildkit:buildx-stable-1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea (v0.33.1)
          driver-opts: image=ghcr.io/vettid/mirror/buildkit@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build and push (amd64 + arm64)
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          # Dockerfile: # syntax=docker.io/docker/dockerfile:1@sha256:4edf897a3ffa55b89f906fc8cc78afdb3f1834cc9c7083565e611a8a7d5fe99e
          build-args: |
            BUILDKIT_SYNTAX=ghcr.io/vettid/mirror/dockerfile@sha256:4edf897a3ffa55b89f906fc8cc78afdb3f1834cc9c7083565e611a8a7d5fe99e
          # Dockerfile: FROM docker.io/library/golang:1.26.10-alpine@sha256:9ce231b28998b32e116927c61aa5c406183061d4f3f2d61b292c88e7f6bdf7ca
          build-contexts: |
            docker.io/library/golang:1.26.10-alpine@sha256:9ce231b28998b32e116927c61aa5c406183061d4f3f2d61b292c88e7f6bdf7ca=docker-image://ghcr.io/vettid/mirror/golang@sha256:9ce231b28998b32e116927c61aa5c406183061d4f3f2d61b292c88e7f6bdf7ca
          tags: |
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
            ghcr.io/${{ github.repository }}:main
      - name: digest
        run: echo "Published ghcr.io/${{ github.repository }}@${{ steps.push.outputs.digest }}" | tee -a "$GITHUB_STEP_SUMMARY"
